<h1>Not so fast on free buses</h1>
<p>Despite what you may have read, free buses are only for residents over 60 and under 18 from January; everyone else still pays the normal fare until the levy is collected.</p>
<p>We asked the council for the small print and are waiting for a reply.</p>
