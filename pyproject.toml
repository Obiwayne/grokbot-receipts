[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grokbot-receipts"
version = "0.1.0"
description = "Fact-check a post with archived sources and a verdict that needs two independent receipts. A skill and CLI for Grok Bot."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Obiwayne" }]
dependencies = []

[project.optional-dependencies]
# Crawl4AI renders pages in a headless browser and turns them into Markdown.
# Without it, receipts falls back to a plain HTTP fetch.
crawl4ai = ["crawl4ai>=0.9.5"]
test = ["pytest>=8"]

[project.scripts]
receipts = "receipts.cli:main"

[project.urls]
Homepage = "https://github.com/Obiwayne/grokbot-receipts"

[tool.setuptools]
packages = ["receipts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
